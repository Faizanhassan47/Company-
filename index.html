  <!-- Theme Init Script -->
  <script>
    (function() {
      try {
        document.documentElement.dataset.theme = 'dark';
        var metaThemeColor = document.createElement('meta');
        metaThemeColor.name = 'theme-color';
        metaThemeColor.content = '#090909';
        document.head.appendChild(metaThemeColor);
      } catch (e) {}
    })();
  </script>
